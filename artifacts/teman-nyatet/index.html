<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>TemanNyatet</title>
    <meta
      name="description"
      content="Catatan cepat dan sederhana untuk semua orang. Notes, keuangan, to-do, dan link saver dalam satu app."
    />
    <meta name="application-name" content="TemanNyatet" />
    <meta name="theme-color" content="#6DB33F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TemanNyatet" />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="TemanNyatet" />
    <meta
      property="og:description"
      content="Catatan cepat dan sederhana untuk semua orang."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="TemanNyatet" />
    <meta
      name="twitter:description"
      content="Catatan cepat dan sederhana untuk semua orang."
    />
    <script>
      // Disable pinch-to-zoom and double-tap zoom on mobile browsers where
      // the viewport meta tag alone is not enough (notably iOS Safari).
      // Desktop keyboard zoom (Ctrl/Cmd + +/-) is intentionally left alone
      // so accessibility settings remain available to users who need them.
      ['gesturestart', 'gesturechange', 'gestureend'].forEach((eventName) => {
        document.addEventListener(eventName, (event) => event.preventDefault(), { passive: false });
      });
    </script>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="color-scheme" content="light" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root" data-boot-shell="true">
      <style>
        .boot-shell {
          min-height: 100dvh;
          display: grid;
          place-items: center;
          padding: 24px;
          box-sizing: border-box;
          background: #f7f9f6;
          color: #183025;
          font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          text-align: center;
        }
        .boot-shell__content { display: grid; justify-items: center; gap: 12px; }
        .boot-shell__spinner {
          width: 28px;
          height: 28px;
          border: 3px solid rgba(53, 122, 91, .18);
          border-top-color: #357a5b;
          border-radius: 999px;
          animation: boot-shell-spin .8s linear infinite;
        }
        .boot-shell__title { margin: 0; font-size: 14px; font-weight: 600; }
        .boot-shell__retry {
          display: none;
          min-height: 42px;
          padding: 0 16px;
          border: 0;
          border-radius: 999px;
          background: #357a5b;
          color: #fff;
          font: inherit;
          font-size: 14px;
          font-weight: 600;
          cursor: pointer;
        }
        @keyframes boot-shell-spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) {
          .boot-shell__spinner { animation: none; }
        }
      </style>
      <div class="boot-shell" role="status" aria-live="polite">
        <div class="boot-shell__content">
          <div class="boot-shell__spinner" aria-hidden="true"></div>
          <p class="boot-shell__title">Memuat TemanNyatet…</p>
          <button class="boot-shell__retry" type="button">Coba lagi</button>
        </div>
      </div>
    </div>
    <script>
      // Keep a visible recovery state if the module graph fails during a
      // dev-server/PWA cold start before React gets a chance to mount.
      (function bootRecovery() {
        var root = document.getElementById('root');
        if (!root) return;
        var showRetry = function () {
          if (root.dataset.bootShell !== 'true') return;
          var status = root.querySelector('.boot-shell__title');
          var retry = root.querySelector('.boot-shell__retry');
          if (status) status.textContent = 'Aplikasi belum siap dimuat.';
          if (retry) retry.style.display = 'inline-flex';
        };
        window.addEventListener('error', showRetry, { once: true });
        window.addEventListener('unhandledrejection', showRetry, { once: true });
        window.setTimeout(showRetry, 10000);
        root.addEventListener('click', function (event) {
          if (event.target && event.target.classList.contains('boot-shell__retry')) {
            window.location.reload();
          }
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
