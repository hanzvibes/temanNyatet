kind = "web"
previewPath = "/"
title = "TemanNyatet"
version = "1.0.0"
id = "artifacts/teman-nyatet"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20104

[services.development]
run = "pnpm --filter @workspace/teman-nyatet run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/teman-nyatet", "run", "build" ]
serve = "static"
publicDir = "artifacts/teman-nyatet/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20104"
BASE_PATH = "/"
